<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lights out</title>
<style>
:root{--bg:#0b1020;--off:#151b2e;--on:#ffc65c;--accent:#6ee7ff}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120vmax 120vmax at 50% 20%, #16203a 0%, var(--bg) 60%);
color:#cdd6e4;font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:13px;color:#8b98ad}
.brand{font-weight:600;color:#e8eef7;font-size:15px}
.hud span{margin-left:14px}
header{padding-right:180px}
#board{display:grid;gap:min(1.4vmin,10px);padding:min(2vmin,16px);background:#0e1426;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 1px #1e2a45}
.tile{width:min(13vmin,84px);height:min(13vmin,84px);border-radius:12px;cursor:pointer;background:var(--off);border:1px solid #23304d;transition:background .18s, box-shadow .18s, transform .08s}
.tile:active{transform:scale(.94)}
.tile.on{background:var(--on);border-color:#ffdf9e;box-shadow:0 0 18px rgba(255,198,92,.55), inset 0 0 12px rgba(255,255,255,.35)}
.tile.invite{animation:pulse 1.6s ease-in-out infinite}
.tile.hint{animation:pulseHint 2.6s ease-in-out}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(110,231,255,0)}50%{box-shadow:0 0 26px rgba(110,231,255,.8);border-color:var(--accent)}}
@keyframes pulseHint{0%,100%{box-shadow:0 0 0 rgba(110,231,255,0)}30%,60%{box-shadow:0 0 30px rgba(110,231,255,.9);border-color:var(--accent)}}
#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(20px);max-width:min(90vw,480px);text-align:center;padding:10px 18px;border-radius:999px;background:rgba(20,28,48,.92);border:1px solid #2a3a5e;color:#e8eef7;font-size:14px;opacity:0;transition:opacity .35s, transform .35s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px;font-size:11px;color:#5f6d85}
footer b{color:#93a3bd;font-weight:600}
#controls{position:fixed;top:10px;right:14px;display:flex;gap:8px}
#controls button{background:#182238;color:#9fb0c8;border:1px solid #2a3a5e;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer}
#controls button:hover{color:#e8eef7;border-color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<header>
<div class="brand">lights out</div>
<div class="hud"><span id="hud-board"></span><span id="hud-moves"></span><span id="hud-time"></span></div>
</header>
<div id="controls">
<button id="btn-new">new board</button>
<button id="btn-sound">sound on</button>
</div>
<div id="board"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<footer id="stats"></footer>
<script src="game.js"></script>
</body>
</html>
